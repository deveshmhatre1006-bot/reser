<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paper Shelf – upload and browse research papers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600;7..72,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#eef1f4; --surface:#ffffff; --ink:#15222e; --muted:#58687a; --line:#d3dae1;
  --accent:#0d5c63; --accent-ink:#ffffff; --tint:#dcecee; --danger:#a3262a;
  --serif:"Literata",Georgia,"Times New Roman",serif;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#10181f; --surface:#17222b; --ink:#e6edf3; --muted:#92a3b3; --line:#2a3a47;
  --accent:#58b6be; --accent-ink:#08242a; --tint:#1b3338; --danger:#ff8b8e;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#10181f; --surface:#17222b; --ink:#e6edf3; --muted:#92a3b3; --line:#2a3a47;
  --accent:#58b6be; --accent-ink:#08242a; --tint:#1b3338; --danger:#ff8b8e;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--sans)}
header{max-width:1100px;margin:0 auto;padding:40px 20px 8px}
h1{font:700 clamp(2rem,5vw,3.2rem)/1.1 var(--serif);margin:0 0 10px;letter-spacing:-.01em}
header p{margin:0;max-width:56ch;color:var(--muted)}
main{max-width:1100px;margin:0 auto;padding:20px;display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:820px){main{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px}
h2{font:600 1.15rem/1.3 var(--serif);margin:0 0 14px}
label{display:block;font-weight:500;font-size:.9rem;margin:14px 0 5px}
input[type=text],input[type=number],textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 10px}
textarea{min-height:92px;resize:vertical}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.drop{display:block;margin:0;border:2px dashed var(--line);border-radius:8px;padding:22px 14px;text-align:center;cursor:pointer;background:var(--bg);transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--tint)}
.drop input{position:absolute;opacity:0;width:1px;height:1px}
.drop:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.drop strong{display:block;font-family:var(--serif);font-size:1.05rem}
.drop span{color:var(--muted);font-size:.88rem}
.row{display:grid;grid-template-columns:1fr 110px;gap:10px}
button{font:600 .95rem var(--sans);cursor:pointer;border-radius:6px;padding:10px 16px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink)}
button:disabled{opacity:.5;cursor:not-allowed}
button.ghost{background:transparent;color:var(--danger);border-color:var(--line);padding:6px 10px;font-weight:500}
button.full{width:100%;margin-top:18px}
.msg{margin:12px 0 0;font-size:.9rem;min-height:1.3em}
.msg.err{color:var(--danger)}.msg.ok{color:var(--accent)}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.bar input{flex:1 1 220px}.bar select{flex:0 1 190px}
.paper{padding:18px 0;border-top:1px solid var(--line)}
.paper:first-child{border-top:0;padding-top:4px}
.paper h3{font:600 1.15rem/1.3 var(--serif);margin:0 0 4px}
.paper .by{color:var(--muted);font-size:.92rem;margin:0 0 8px}
.paper .abs{margin:0 0 10px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;max-width:68ch}
.paper.open .abs{-webkit-line-clamp:unset;display:block}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.85rem;color:var(--muted)}
.tag{background:var(--tint);color:var(--ink);border-radius:999px;padding:2px 10px}
.meta a{color:var(--accent);font-weight:600}
.meta .sp{flex:1}
.empty{padding:36px 8px;text-align:center;color:var(--muted)}
.empty strong{display:block;font-family:var(--serif);color:var(--ink);font-size:1.1rem;margin-bottom:4px}
.count{color:var(--muted);font-size:.88rem;margin:0 0 6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <h1>Paper Shelf</h1>
  <p>Upload a research paper as a PDF, add its details, and share it with everyone who can open this page.</p>
</header>
<main>
  <section class="panel" aria-labelledby="up-h">
    <h2 id="up-h">Upload a paper</h2>
    <div id="status" class="msg" role="status"></div>
    <form id="form" novalidate onsubmit="return false">
      <label class="drop" id="drop">
        <input type="file" id="file" accept="application/pdf,.pdf">
        <strong id="fname">Choose a PDF or drop it here</strong>
        <span>PDF only, up to 20 MB</span>
      </label>
      <label for="title">Title</label>
      <input type="text" id="title" maxlength="250" autocomplete="off">
      <label for="authors">Authors <span style="font-weight:400;color:var(--muted)">(separate with commas)</span></label>
      <input type="text" id="authors" maxlength="300" autocomplete="off">
      <div class="row">
        <div>
          <label for="field">Field</label>
          <select id="field">
            <option>Computer science</option><option>Physics</option><option>Mathematics</option>
            <option>Biology</option><option>Chemistry</option><option>Medicine</option>
            <option>Engineering</option><option>Social sciences</option><option>Economics</option>
            <option>Humanities</option><option>Other</option>
          </select>
        </div>
        <div>
          <label for="year">Year</label>
          <input type="number" id="year" min="1900" max="2100">
        </div>
      </div>
      <label for="abstract">Abstract</label>
      <textarea id="abstract" maxlength="3000"></textarea>
      <label for="keywords">Keywords <span style="font-weight:400;color:var(--muted)">(optional, comma-separated)</span></label>
      <input type="text" id="keywords" maxlength="200" autocomplete="off">
      <button type="button" class="full" id="submit">Upload paper</button>
      <p id="formmsg" class="msg" role="status"></p>
    </form>
  </section>

  <section class="panel" aria-labelledby="lib-h">
    <h2 id="lib-h">Library</h2>
    <div class="bar">
      <input type="text" id="q" placeholder="Search title, author, keyword" aria-label="Search papers">
      <select id="ff" aria-label="Filter by field"><option value="">All fields</option></select>
    </div>
    <p class="count" id="count"></p>
    <div id="list"></div>
  </section>
</main>

<script>
(function(){
  var $ = function(id){return document.getElementById(id)};
  var db=null, assets=null, papers=[], chosen=null;
  var MAX=20*1024*1024;
  $("year").value=new Date().getFullYear();

  function setMsg(el,text,kind){el.textContent=text||"";el.className="msg"+(kind?" "+kind:"")}
  function fmtSize(b){return b>1048576?(b/1048576).toFixed(1)+" MB":Math.max(1,Math.round(b/1024))+" KB"}

  function pick(f){
    if(!f)return;
    if(f.type!=="application/pdf"&&!/\.pdf$/i.test(f.name)){setMsg($("formmsg"),"That file isn’t a PDF. Choose a .pdf file.","err");return}
    if(f.size>MAX){setMsg($("formmsg"),"That PDF is "+fmtSize(f.size)+". The limit is 20 MB.","err");return}
    chosen=f;$("fname").textContent=f.name;setMsg($("formmsg"),"");
    if(!$("title").value)$("title").value=f.name.replace(/\.pdf$/i,"").replace(/[_-]+/g," ");
  }
  $("file").addEventListener("change",function(e){pick(e.target.files[0])});
  var drop=$("drop");
  ["dragenter","dragover"].forEach(function(t){drop.addEventListener(t,function(e){e.preventDefault();drop.classList.add("over")})});
  ["dragleave","drop"].forEach(function(t){drop.addEventListener(t,function(e){e.preventDefault();drop.classList.remove("over")})});
  drop.addEventListener("drop",function(e){pick(e.dataTransfer.files[0])});

  $("submit").addEventListener("click",async function(){
    var m=$("formmsg"),btn=$("submit");
    var title=$("title").value.trim(),authors=$("authors").value.trim(),abs=$("abstract").value.trim();
    if(!chosen){setMsg(m,"Choose a PDF to upload.","err");return}
    if(!title){setMsg(m,"Add the paper’s title.","err");return}
    if(!authors){setMsg(m,"Add at least one author.","err");return}
    if(!db||!assets){setMsg(m,"Uploading isn’t available for your account on this page.","err");return}
    btn.disabled=true;setMsg(m,"Uploading…");
    try{
      var up=await assets.upload(chosen);
      var id=(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(36).slice(2));
      await db.collection("papers").doc(id).set({
        title:title,authors:authors,abstract:abs,
        keywords:$("keywords").value.trim(),field:$("field").value,
        year:Number($("year").value)||new Date().getFullYear(),
        fileUrl:up.url,assetId:up.id,size:up.sizeBytes,fileName:chosen.name,
        addedAt:Date.now()
      });
      setMsg(m,"Uploaded. Your paper is in the library.","ok");
      chosen=null;$("file").value="";$("fname").textContent="Choose a PDF or drop it here";
      ["title","authors","abstract","keywords"].forEach(function(k){$(k).value=""});
    }catch(err){
      setMsg(m,"Upload failed"+(err&&err.message?": "+err.message:"")+". Try again.","err");
    }finally{btn.disabled=false}
  });

  function render(){
    var q=$("q").value.trim().toLowerCase(),ff=$("ff").value,list=$("list");
    // field filter options
    var fields=Array.from(new Set(papers.map(function(p){return p.field}).filter(Boolean))).sort();
    var cur=$("ff").value;
    $("ff").innerHTML="";
    var all=document.createElement("option");all.value="";all.textContent="All fields";$("ff").appendChild(all);
    fields.forEach(function(f){var o=document.createElement("option");o.value=f;o.textContent=f;$("ff").appendChild(o)});
    $("ff").value=fields.indexOf(cur)>-1?cur:"";ff=$("ff").value;

    var rows=papers.filter(function(p){
      if(ff&&p.field!==ff)return false;
      if(!q)return true;
      return [p.title,p.authors,p.keywords,p.abstract].join(" ").toLowerCase().indexOf(q)>-1;
    }).sort(function(a,b){return (b.addedAt||0)-(a.addedAt||0)});

    $("count").textContent=papers.length?rows.length+" of "+papers.length+" papers":"";
    list.textContent="";
    if(!rows.length){
      var e=document.createElement("div");e.className="empty";
      var s=document.createElement("strong");
      s.textContent=papers.length?"No papers match your search":"No papers yet";
      e.appendChild(s);
      e.appendChild(document.createTextNode(papers.length?"Try a different word or clear the field filter.":"Upload the first paper using the form."));
      list.appendChild(e);return;
    }
    rows.forEach(function(p){
      var a=document.createElement("article");a.className="paper";
      var h=document.createElement("h3");h.textContent=p.title||"Untitled";a.appendChild(h);
      var by=document.createElement("p");by.className="by";by.textContent=(p.authors||"Unknown authors")+(p.year?" · "+p.year:"");a.appendChild(by);
      if(p.abstract){
        var ab=document.createElement("p");ab.className="abs";ab.textContent=p.abstract;
        ab.tabIndex=0;ab.title="Show full abstract";
        var tog=function(){a.classList.toggle("open")};
        ab.addEventListener("click",tog);
        ab.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();tog()}});
        a.appendChild(ab);
      }
      var meta=document.createElement("div");meta.className="meta";
      if(p.field){var t=document.createElement("span");t.className="tag";t.textContent=p.field;meta.appendChild(t)}
      (p.keywords||"").split(",").map(function(k){return k.trim()}).filter(Boolean).slice(0,4).forEach(function(k){
        var t=document.createElement("span");t.className="tag";t.textContent=k;meta.appendChild(t)});
      var sz=document.createElement("span");sz.textContent="PDF, "+fmtSize(p.size||0);meta.appendChild(sz);
      var sp=document.createElement("span");sp.className="sp";meta.appendChild(sp);
      if(typeof p.fileUrl==="string"&&p.fileUrl.indexOf("/_blob/")===0){
        var l=document.createElement("a");l.href=p.fileUrl;l.target="_blank";l.rel="noopener";l.textContent="Open PDF";meta.appendChild(l);
      }
      var d=document.createElement("button");d.type="button";d.className="ghost";d.textContent="Delete";
      d.addEventListener("click",async function(){
        if(!confirm("Delete “"+(p.title||"this paper")+"” from the library?"))return;
        try{await db.collection("papers").doc(p.id).delete();if(assets&&p.assetId)try{await assets.delete(p.assetId)}catch(e){}}
        catch(err){setMsg($("status"),"Couldn’t delete that paper. You may not have permission.","err")}
      });
      meta.appendChild(d);
      a.appendChild(meta);list.appendChild(a);
    });
  }
  $("q").addEventListener("input",render);
  $("ff").addEventListener("change",render);

  async function init(){
    render();
    if(!window.claude||!claude.use){setMsg($("status"),"Open this page on claude.ai to upload and browse papers.","err");$("submit").disabled=true;return}
    try{db=await claude.use("db");assets=await claude.use("assets")}catch(e){}
    if(!db){setMsg($("status"),"Sign in to claude.ai to see and upload papers.","err");$("submit").disabled=true;return}
    if(!assets){setMsg($("status"),"You can browse papers here, but your account can’t upload files.","err");$("submit").disabled=true}
    var timer=setTimeout(function(){setMsg($("status"),"The library is taking a while to load. Check your connection.","err")},10000);
    db.collection("papers").onSnapshot(function(snap){
      clearTimeout(timer);
      papers=snap.docs.map(function(d){var x=d.data()||{};x.id=d.id;return x});
      render();
    },function(){clearTimeout(timer);setMsg($("status"),"Couldn’t load the library.","err")});
  }
  init();
})();
</script>
</body>
</html>
